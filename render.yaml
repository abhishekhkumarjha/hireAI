services:
  - type: web
    name: hire-ai-portal
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
        description: "Your Gemini API Key from Google AI Studio (optional, fallbacks to offline parser if not set)"
